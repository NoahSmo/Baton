name: Release

# Run manually (Actions > Release > Run workflow) to publish a release: macOS zip,
# Linux packages, GitHub release and Homebrew cask. The version comes from
# scripts/ci-version.mjs. Typecheck and tests run on every push in ci.yml.
on:
  workflow_dispatch:

# One release at a time, so two quick runs never pick the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Quieter, faster installs.
  npm_config_audit: 'false'
  npm_config_fund: 'false'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: version
        run: echo "version=$(node scripts/ci-version.mjs)" >> "$GITHUB_OUTPUT"

  # Runs alongside the builds instead of before them; publish waits for it.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  macos:
    needs: version
    runs-on: macos-latest # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-${{ runner.arch }}-
      - run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/Baton-${{ needs.version.outputs.version }}.zip
          if-no-files-found: error

  linux:
    needs: version
    strategy:
      matrix:
        # One job per package format: each repackages the same app, so they run in parallel.
        # Runners are pinned, not ubuntu-latest: node-pty is compiled here and links against
        # the runner's glibc, so a newer runner makes the app fail to start on older distros.
        arch: [x64, arm64]
        target: [deb, rpm, tar.gz]
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-${{ runner.arch }}-
      - name: Install rpm tooling
        if: matrix.target == 'rpm'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm
      - run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version
      - run: npm ci
      - run: npx electron-vite build && npx electron-builder --linux ${{ matrix.target }} --publish never
      - name: Check the native module loads on glibc 2.35 (Ubuntu 22.04, Debian 12)
        run: |
          pty=$(find dist -path '*/node-pty/build/Release/pty.node' | head -n 1)
          test -n "$pty"
          max=$(objdump -T "$pty" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1)
          echo "pty.node needs up to $max"
          test "$(printf '%s\nGLIBC_2.35\n' "$max" | sort -V | tail -n 1)" = GLIBC_2.35
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-${{ matrix.target }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [version, check, macos, linux]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Check the artifacts
        run: |
          ls -l artifacts
          test "$(ls artifacts/Baton-"$VERSION"-linux-* | wc -l)" -eq 6
          test -f "artifacts/Baton-$VERSION.zip"
      - name: Create the GitHub release
        run: |
          gh release create "v$VERSION" artifacts/* \
            --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
      - name: Update the Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::secret HOMEBREW_TAP_TOKEN is missing: the release is published but the cask was not updated"
            exit 1
          fi
          sha256=$(sha256sum "artifacts/Baton-$VERSION.zip" | cut -d' ' -f1)
          git clone "https://x-access-token:$TAP_TOKEN@github.com/NoahSmo/homebrew-tap.git" tap
          node scripts/bump-cask.mjs tap/Casks/baton.rb "$VERSION" "$sha256"
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "baton $VERSION"
          git push
